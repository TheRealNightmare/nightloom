# Nightloom uv workspace root.
#
# This is a *virtual* workspace root: it has no [project] table and is never
# built or installed. It only holds the member list, shared dev tooling and
# tool configuration. packages/core (nightloom-core) is the shared entity
# model, packages/sdk (nightloom-sdk) the Shuttle SDK, apps/worker the Celery
# worker that runs Shuttles, and every directory under shuttles/ one built-in
# Shuttle (picked up by the glob below).

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core", "packages/sdk", "shuttles/*"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx>=0.28",
    "hypothesis>=6.170.15",
    "mypy>=1.18",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.17.5",
    "types-aiobotocore[s3]>=2.25.1,<2.26",
]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = [
    "apps/api/src",
    "apps/api/tests",
    "apps/worker/src",
    "apps/worker/tests",
    "packages/core/src",
    "packages/core/tests",
    "packages/sdk/src",
    "packages/sdk/tests",
    "shuttles/*/src",
    "shuttles/*/tests",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest tests are written; tests use obviously fake credentials.
"**/tests/**/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = [
    "nightloom_api",
    "nightloom_core",
    "nightloom_sdk",
    "nightloom_shuttle_crtsh",
    "nightloom_shuttle_dns",
    "nightloom_shuttle_rdap",
    "nightloom_shuttle_registrable_domain",
    "nightloom_worker",
]

[tool.ruff.format]
quote-style = "double"

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "apps/api/src",
    "apps/api/tests",
    "apps/api/alembic/env.py",
    "apps/worker/src",
    "apps/worker/tests",
    "packages/core/src",
    "packages/core/tests",
    "packages/sdk/src",
    "packages/sdk/tests",
    "shuttles/crtsh/src",
    "shuttles/crtsh/tests",
    "shuttles/dns/src",
    "shuttles/dns/tests",
    "shuttles/rdap/src",
    "shuttles/rdap/tests",
    "shuttles/registrable-domain/src",
    "shuttles/registrable-domain/tests",
]
# Only re-exports the API's database fixtures; a second module named
# `conftest` would clash with apps/api/tests/conftest.py.
exclude = ['^apps/worker/tests/conftest\.py$']
# apps/api/tests holds `support`, the test helper module.
mypy_path = [
    "apps/api/src",
    "apps/api/tests",
    "apps/worker/src",
    "packages/core/src",
    "packages/sdk/src",
    "shuttles/crtsh/src",
    "shuttles/dns/src",
    "shuttles/rdap/src",
    "shuttles/registrable-domain/src",
]

# aioboto3 ships no type information. Only its Session factory is used; the S3
# client it returns is typed via types-aiobotocore-s3 (S3Client).
[[tool.mypy.overrides]]
module = ["aioboto3", "aioboto3.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --- pytest / coverage ------------------------------------------------------

[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "apps/worker/tests",
    "packages/core/tests",
    "packages/sdk/tests",
    "shuttles",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# `support` (shared test helpers) is imported from here.
pythonpath = ["apps/api/tests"]
markers = [
    "db: needs PostgreSQL and Valkey (`make deps-up`); part of `make test`",
    "graph: needs Neo4j (`make deps-up`); part of `make test`",
    "integration: needs the running stack (`make up`); run with `make test-integration`",
    "network: queries the real internet (public DNS, crt.sh, RDAP); opt-in with `make test-network`",
]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    # Integration and real-network tests are opt-in: `make test-integration`
    # passes `-m integration`, `make test-network` passes `-m network`.
    # Database tests (`db`) run by default and need PostgreSQL and Valkey.
    "-m",
    "not integration and not network",
    "--cov=nightloom_api",
    "--cov=nightloom_core",
    "--cov=nightloom_sdk",
    "--cov=nightloom_worker",
    "--cov=nightloom_shuttle_crtsh",
    "--cov=nightloom_shuttle_dns",
    "--cov=nightloom_shuttle_rdap",
    "--cov=nightloom_shuttle_registrable_domain",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

[tool.coverage.run]
branch = true
# SQLAlchemy's asyncio layer runs code in greenlets; without this, lines that
# run after an awaited database call are not recorded.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
