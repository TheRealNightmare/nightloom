name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Python comes from .python-version, which uv reads automatically.
# `uv sync --locked` fails if uv.lock is out of date with pyproject.toml.

jobs:
  # Every package has the same version (scripts/check-versions.py), and
  # CHANGELOG.md has a section for it, as the release workflow requires.
  versions:
    name: Versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: python3 scripts/check-versions.py

      - name: CHANGELOG.md has a section for the version
        run: python3 scripts/changelog-section.py "$(python3 scripts/check-versions.py --print)" > /dev/null

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # mypy runs in its own job below; the web hooks (Prettier, ESLint) run
      # in the `web` job, which has Node and the pnpm dependencies.
      - run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy,web-prettier,web-eslint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - run: make typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database and graph tests (markers `db`, `graph`) need PostgreSQL,
    # Valkey and Neo4j. Same image tags as deploy/compose.yaml. Service
    # containers cannot take a command, so Valkey runs without a password here;
    # it is only reachable from this job. The Neo4j password is a CI-only
    # throwaway for this disposable container.
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: nightloom
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: nightloom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nightloom -d nightloom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.0.7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      neo4j:
        image: neo4j:2026.10.2-community
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
          NEO4J_server_memory_heap_initial__size: 512m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
          NEO4J_dbms_usage__report_enabled: "false"
        ports:
          - 7687:7687
        # Healthy once Bolt accepts the credentials, not just when HTTP is up.
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-neo4j-password 'RETURN 1'"
          --health-interval 5s
          --health-timeout 20s
          --health-retries 30
          --health-start-period 20s
    env:
      NIGHTLOOM_TEST_DATABASE_URL: postgresql+asyncpg://nightloom:ci-postgres-password@127.0.0.1:5432/nightloom_test
      NIGHTLOOM_TEST_VALKEY_URL: redis://127.0.0.1:6379/15
      NIGHTLOOM_TEST_NEO4J_URI: bolt://127.0.0.1:7687
      NIGHTLOOM_TEST_NEO4J_PASSWORD: ci-neo4j-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - run: make test
        env:
          PYTEST_ADDOPTS: --cov-report=xml

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

  # The shared entity model must produce identical canonical keys on every
  # supported interpreter (ipaddress changed its output between 3.12 patch
  # releases). Runs only packages/core's tests, which need no services, on the
  # oldest and newest 3.12 and on 3.13, with Python versions managed by uv.
  core-compat:
    name: Core on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.0", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Show the interpreter
        run: uv run --python "$PYTHON" --no-project python --version
        env:
          PYTHON: ${{ matrix.python }}

      - run: make test-core-compat CORE_COMPAT_PYTHONS="$PYTHON"
        env:
          PYTHON: ${{ matrix.python }}

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node version from .node-version (current Active LTS).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      # Node 25+ no longer bundles Corepack. Corepack then provides the exact
      # pnpm version pinned in package.json ("packageManager").
      - name: Enable Corepack (pnpm)
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: make web-lint
      - run: make web-typecheck
      - run: make web-test
      - run: make web-build
      # The 2D graph's bundle and the lazily loaded 3D view stay within budget.
      - run: make web-size

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: web-coverage
          path: apps/web/coverage/
          retention-days: 14
          if-no-files-found: warn

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose files
        run: |
          docker compose -f deploy/compose.yaml --env-file .env.example config -q
          docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml \
            --env-file .env.example config -q
          docker compose -f deploy/compose.yaml --profile screenshots \
            --env-file .env.example config -q

      # Production: every variant (each edge, small host) is valid, publishes
      # nothing but the edge's ports 80/443 and pulls the release images of
      # this version instead of building.
      - name: Check the production Compose files
        run: deploy/tests/check-prod-ports.sh .env.example

      - uses: docker/setup-buildx-action@v4

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: nightloom-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Readiness comes from the image's own HEALTHCHECK, polled every 2s
      # here instead of every 30s. Requests retry transport errors, because a
      # container can reset the first connections right after turning healthy.
      - name: Smoke test API image
        run: |
          set -euo pipefail
          container=nightloom-api
          fail() {
            echo "::error title=Smoke test::$1"
            docker logs "$container" || true
            exit 1
          }
          docker run -d --name "$container" --health-interval 2s \
            -p 127.0.0.1:8000:8000 nightloom-api:ci

          state=""
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if ! state=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' "$container"); then
              fail "Cannot inspect the API container."
            fi
            [[ "$state" == "running healthy" || "$state" != running* ]] && break
            sleep 1
          done
          if [[ "$state" != "running healthy" ]]; then
            fail "API container did not become healthy within 60s (state: ${state:-unknown})."
          fi
          echo "API container is healthy."

          if ! health=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:8000/api/v1/health); then
            fail "API did not answer /api/v1/health with 200."
          fi
          echo "/api/v1/health: $health"

          # Nothing else is running, so readiness must report the dependencies
          # as down (503). Retry only transport errors (status 000): curl's
          # --retry would also retry the expected 503.
          code=000
          for _ in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/ready) || true
            [[ "$code" != "000" ]] && break
            sleep 1
          done
          if [[ "$code" != "503" ]]; then
            fail "Expected /api/v1/ready to return 503 without dependencies, got $code."
          fi
          echo "/api/v1/ready returned 503 as expected."

      # The same image runs the worker: it must ship Celery, the SDK and
      # the built-in Shuttles.
      - name: Check the worker parts of the image
        run: |
          set -euo pipefail
          docker run --rm nightloom-api:ci celery --version
          shuttles=$(docker run --rm nightloom-api:ci python -m nightloom_sdk.registry list)
          echo "$shuttles"
          for name in crtsh dns favicon github-commits github-repos github-secrets github-user gleif gravatar hibp-account hibp-breaches http-headers internetdb port-check rdap registrable-domain reverse-dns ripestat screenshot site-files typosquats wayback web-tech wikidata; do
            if ! grep -q "^$name " <<< "$shuttles"; then
              echo "::error title=Shuttles::$name is not installed in the image."
              exit 1
            fi
          done
          # The screenshot Shuttle's Playwright driver starts in the image.
          docker run --rm nightloom-api:ci python -c "$(printf '%s\n' \
            'import asyncio' \
            'from playwright.async_api import async_playwright' \
            'async def main():' \
            '    async with async_playwright():' \
            '        print("Playwright driver OK")' \
            'asyncio.run(main())')"
          # Every Shuttle's configuration is valid with the defaults...
          docker run --rm nightloom-api:ci python -m nightloom_sdk.registry check
          # ...and a private DNS resolver is refused.
          if docker run --rm -e NIGHTLOOM_DNS_RESOLVERS=10.0.0.53 nightloom-api:ci \
              python -m nightloom_sdk.registry check; then
            echo "::error title=Shuttles::a private DNS resolver was accepted."
            exit 1
          fi

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: nightloom-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test web image
        run: |
          set -euo pipefail
          container=nightloom-web
          fail() {
            echo "::error title=Smoke test::$1"
            docker logs "$container" || true
            exit 1
          }
          docker run -d --name "$container" --health-interval 2s \
            -p 127.0.0.1:8080:8080 nightloom-web:ci

          state=""
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            if ! state=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' "$container"); then
              fail "Cannot inspect the web container."
            fi
            [[ "$state" == "running healthy" || "$state" != running* ]] && break
            sleep 1
          done
          if [[ "$state" != "running healthy" ]]; then
            fail "Web container did not become healthy within 60s (state: ${state:-unknown})."
          fi
          echo "Web container is healthy."

          if ! result=$(curl -sS --retry 5 --retry-all-errors --retry-delay 1 \
            -o /dev/null -w '%{http_code} %{content_type}' http://127.0.0.1:8080/); then
            fail "Request to / failed: ${result:-no answer}."
          fi
          code=${result%% *}
          type=${result#* }
          if [[ "$code" != "200" || "$type" != text/html* ]]; then
            fail "Expected / to return 200 text/html, got $code $type."
          fi
          echo "/ returned $code $type."

      # Which client address nginx trusts for each NIGHTLOOM_EDGE (none,
      # caddy, cloudflared; unknown values must not start), with containers
      # at fixed addresses standing in for the edge proxies.
      - name: nginx real-IP handling per edge
        run: deploy/tests/nginx-real-ip.sh nightloom-web:ci

      - name: Container logs
        if: failure()
        run: |
          for container in nightloom-api nightloom-web; do
            echo "::group::docker logs $container"
            docker logs "$container" 2>&1 || echo "($container was not started)"
            echo "::endgroup::"
          done

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # CI-ONLY throwaway credentials for the end-to-end admin. They exist only
      # in the disposable stack this job starts and stops; they are not secrets
      # and must never be used anywhere else.
      NIGHTLOOM_E2E_EMAIL: e2e-admin@example.org
      NIGHTLOOM_E2E_PASSWORD: ci-only-throwaway-e2e-password
      # DNS jobs never touch the internet here: the stack runs with the
      # test-only CoreDNS server (deploy/compose.test.yaml) and the Playwright
      # DNS test uses its zone.
      NIGHTLOOM_E2E_DNS_DOMAIN: nightloom-test.example
      NIGHTLOOM_E2E_DNS_EXPECT_MX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      # Node and pnpm for the Playwright end-to-end tests (same setup as `web`).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack (pnpm)
        run: |
          npm install --global corepack@0.36.0
          corepack enable
          pnpm --version
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The example values are fine for a throwaway CI stack.
      - run: cp .env.example .env

      # TEST_DNS=1 adds a local authoritative DNS server (CoreDNS, zone
      # nightloom-test.example) and points the worker's DNS Shuttle at it.
      # SCREENSHOTS=1 also starts the screenshot Shuttle's browser service.
      - name: Start the stack with the test DNS server (waits until healthy)
        run: make up TEST_DNS=1 SCREENSHOTS=1

      # Includes a registrable-domain job and a DNS job end to end: API ->
      # Valkey -> worker -> (test DNS) -> Neo4j, checked through GET /graph.
      - run: make test-integration TEST_DNS=1

      # The browser has no route out, and the worker draws pages in it.
      - name: Check the browser service
        run: make check-browser TEST_DNS=1

      - name: Check the API through the web proxy
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8080/api/v1/health
          echo
          curl -fsS -o /dev/null -w '/ returned %{http_code} %{content_type}\n' http://127.0.0.1:8080/

      - name: Install Playwright Chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: make e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump stack logs
        if: failure()
        run: |
          make ps TEST_DNS=1 SCREENSHOTS=1
          docker compose -f deploy/compose.yaml -f deploy/compose.test.yaml \
            --profile screenshots --env-file .env logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: make down TEST_DNS=1 SCREENSHOTS=1

  # The production stack (deploy/compose.prod.yaml) with the HTTPS edge:
  # Caddy with its internal CA for nightloom.localhost on 127.0.0.1:8443
  # (deploy/compose.edge-test.yaml), secrets from `make secrets`. Checks the
  # real client IP through Caddy and nginx, then a full backup -> wipe ->
  # restore round trip. FROM_SOURCE=1 (deploy/compose.source.yaml) builds the
  # images from this commit instead of pulling the published release.
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI-ONLY throwaway admin for the disposable stack of this job.
      NIGHTLOOM_TEST_ADMIN_EMAIL: backup-admin@example.org
      NIGHTLOOM_TEST_ADMIN_PASSWORD: ci-only-throwaway-backup-password
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --locked

      - name: Generate a production .env
        run: make secrets ARGS="--domain nightloom.localhost --acme-email admin@example.org"

      - name: Start the production stack with the test edge (waits until healthy)
        run: make up EDGE_TEST=1 FROM_SOURCE=1

      - name: Client IP, cookies and headers through Caddy
        run: make test-edge EDGE_TEST=1 FROM_SOURCE=1

      - name: Backup, wipe, restore and verify
        run: make test-backup-restore EDGE_TEST=1 FROM_SOURCE=1
        env:
          NIGHTLOOM_TEST_DESTRUCTIVE: "1"
          NIGHTLOOM_TEST_BASE_URL: https://127.0.0.1:8443

      - name: Dump stack logs
        if: failure()
        run: |
          make ps EDGE_TEST=1 FROM_SOURCE=1
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            -f deploy/compose.source.yaml -f deploy/compose.edge-test.yaml --env-file .env \
            logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml \
            -f deploy/compose.source.yaml -f deploy/compose.edge-test.yaml --env-file .env \
            down -v --remove-orphans

  dco:
    name: DCO sign-off
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check every commit is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Dependabot cannot sign off its commits; they are machine-made
          # dependency bumps, so they are skipped (and listed). Everyone else
          # must sign off.
          bot_name='dependabot[bot]'
          bot_email='49699333+dependabot[bot]@users.noreply.github.com'

          # Plain assignment (not process substitution) so a git error fails the step.
          commits=$(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          unsigned=()
          skipped=()
          for sha in $commits; do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            if [[ "$author_name" == "$bot_name" || "$author_email" == "$bot_email" ]]; then
              skipped+=("$sha")
              continue
            fi
            signoff=$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")
            if [[ -z "${signoff//[[:space:]]/}" ]]; then
              unsigned+=("$sha")
            fi
          done

          if (( ${#skipped[@]} > 0 )); then
            echo "Skipped ${#skipped[@]} commit(s) authored by $bot_name:"
            for sha in "${skipped[@]}"; do
              echo "  $(git rev-parse --short "$sha")"
            done
          fi

          if (( ${#unsigned[@]} == 0 )); then
            echo "All other commits in $BASE_SHA..$HEAD_SHA are signed off."
            exit 0
          fi

          # Commit subjects are untrusted; stop workflow-command parsing while printing them.
          token=$(openssl rand -hex 16)
          echo "::stop-commands::$token"
          echo "These commits are missing a 'Signed-off-by:' trailer:"
          for sha in "${unsigned[@]}"; do
            echo "  $(git show -s --format='%h %s' "$sha")"
          done
          echo "::$token::"
          echo "::error title=DCO::${#unsigned[@]} commit(s) are not signed off. Sign off with 'git commit --amend -s --no-edit' (last commit) or 'git rebase --signoff main' (all commits), then force-push. See CONTRIBUTING.md#developer-certificate-of-origin-dco."
          exit 1
