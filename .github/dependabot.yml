version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope # -> "ci(deps): ..."
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..." / "build(deps-dev): ..."
    groups:
      python:
        update-types: [minor, patch]

  # pnpm workspace (root package.json + apps/web), from pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..." / "build(deps-dev): ..."
    groups:
      npm:
        update-types: [minor, patch]

  # Base images in apps/api/Dockerfile.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..."
    groups:
      docker:
        update-types: [minor, patch]

  # Base images in apps/web/Dockerfile (Node build stage, nginx runtime).
  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..."
    groups:
      docker-web:
        update-types: [minor, patch]

  # Service images in deploy/compose.yaml.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..."
    groups:
      docker-compose:
        update-types: [minor, patch]
