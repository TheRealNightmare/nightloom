version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope # -> "ci(deps): ..."
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..." / "build(deps-dev): ..."
    groups:
      python:
        update-types: [minor, patch]

  # Base images in apps/api/Dockerfile.
  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..."
    groups:
      docker:
        update-types: [minor, patch]

  # Service images in deploy/compose.yaml.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope # -> "build(deps): ..."
    groups:
      docker-compose:
        update-types: [minor, patch]
