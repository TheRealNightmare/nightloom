[project]
name = "nightloom-shuttle-usernames"
version = "0.3.0"
description = "Built-in Nightloom Shuttle: on which platforms a username exists (leads only)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
username-presence = "nightloom_shuttle_usernames:UsernamePresenceShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
