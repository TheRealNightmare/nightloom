[project]
name = "nightloom-shuttle-active"
version = "0.1.0"
description = "Built-in active Nightloom Shuttles: a site's HTTP headers and TLS certificate, and a small TCP port check. They touch the target, so they only run on targets a case has verified."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
http-headers = "nightloom_shuttle_active:HttpHeadersShuttle"
port-check = "nightloom_shuttle_active:PortCheckShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
