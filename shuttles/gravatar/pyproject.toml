[project]
name = "nightloom-shuttle-gravatar"
version = "0.3.0"
description = "Built-in Nightloom Shuttle: an email address's public Gravatar profile and the accounts its owner verified there."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
gravatar = "nightloom_shuttle_gravatar:GravatarShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
