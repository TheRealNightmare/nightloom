[project]
name = "nightloom-shuttle-registrable-domain"
version = "0.3.0"
description = "Built-in Nightloom Shuttle: a domain's registrable domain, from the bundled Public Suffix List (no network)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
registrable-domain = "nightloom_shuttle_registrable_domain:RegistrableDomain"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
