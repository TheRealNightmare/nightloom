[project]
name = "nightloom-shuttle-rdap"
version = "0.2.0"
description = "Built-in Nightloom Shuttle: registration data (RDAP) for domains, IP addresses, netblocks and AS numbers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
rdap = "nightloom_shuttle_rdap:RdapShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
