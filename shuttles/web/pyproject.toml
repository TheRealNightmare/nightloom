[project]
name = "nightloom-shuttle-web"
version = "0.3.0"
description = "Built-in Nightloom Shuttles that visit a site's public pages like a browser: its robots.txt, security.txt and sitemap, the technologies its home page uses, and its favicon hash. They run where a case allows website visits, or on verified domains."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
    "nightloom-shuttle-wayback",
]

[project.entry-points."nightloom.shuttles"]
favicon = "nightloom_shuttle_web:FaviconShuttle"
site-files = "nightloom_shuttle_web:SiteFilesShuttle"
web-tech = "nightloom_shuttle_web:WebTechShuttle"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
nightloom-shuttle-wayback = { workspace = true }
