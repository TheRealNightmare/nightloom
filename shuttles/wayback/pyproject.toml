[project]
name = "nightloom-shuttle-wayback"
version = "0.1.0"
description = "Built-in Nightloom Shuttle: a domain's archived URLs and subdomains from the Internet Archive's Wayback Machine (CDX API)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
wayback = "nightloom_shuttle_wayback:WaybackShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
