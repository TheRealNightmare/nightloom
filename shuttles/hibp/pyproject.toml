[project]
name = "nightloom-shuttle-hibp"
version = "0.3.0"
description = "Built-in Nightloom Shuttles: the published breaches of a site and of an email address (Have I Been Pwned), metadata only."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
hibp-breaches = "nightloom_shuttle_hibp:HibpBreachesShuttle"
hibp-account = "nightloom_shuttle_hibp:HibpAccountShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
