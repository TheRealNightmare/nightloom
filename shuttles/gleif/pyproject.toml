[project]
name = "nightloom-shuttle-gleif"
version = "0.4.0"
description = "Built-in Nightloom Shuttle: an organization's Legal Entity Identifier record, parents and subsidiaries (GLEIF)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpx>=0.28.1",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
gleif = "nightloom_shuttle_gleif:GleifShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
