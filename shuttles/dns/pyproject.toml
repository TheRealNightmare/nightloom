[project]
name = "nightloom-shuttle-dns"
version = "0.2.0"
description = "Built-in Nightloom Shuttles: a domain's public DNS records (A, AAAA, CNAME, MX, NS, TXT, SOA, CAA, DMARC) and reverse DNS (PTR) for addresses and small netblocks, through public resolvers only."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "dnspython>=2.9.2",
    "nightloom-core",
    "nightloom-sdk",
]

[project.entry-points."nightloom.shuttles"]
dns = "nightloom_shuttle_dns:DnsShuttle"
reverse-dns = "nightloom_shuttle_dns:ReverseDnsShuttle"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
