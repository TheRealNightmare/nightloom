[project]
name = "nightloom-core"
version = "0.4.0"
description = "Nightloom's shared entity model: entity types, canonical keys, relationships and provenance."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "idna>=3.20",
    "phonenumbers>=9.0.43",
    "pydantic>=2.14.3",
    "tldextract>=5.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
