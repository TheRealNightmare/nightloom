[project]
name = "nightloom-sdk"
version = "0.4.0"
description = "Nightloom Shuttle SDK: the Shuttle contract, a guarded HTTP client, the registry and test helpers."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "nightloom-core",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
