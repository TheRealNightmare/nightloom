[project]
name = "nightloom-api"
version = "0.3.0"
description = "Nightloom HTTP API (FastAPI)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "anyio>=4.16",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.7.0",
    "fastapi>=0.120",
    "neo4j>=6.4.1",
    "nightloom-core",
    "nightloom-sdk",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2",
    "pydantic-settings>=2.11",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
