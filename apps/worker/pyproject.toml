[project]
name = "nightloom-worker"
version = "0.3.0"
description = "Nightloom background worker (Celery): runs Shuttle jobs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "celery[redis]>=5.7.0",
    "nightloom-api",
    "nightloom-core",
    "nightloom-sdk",
    # Built-in Shuttles, installed wherever the worker runs.
    "nightloom-shuttle-active",
    "nightloom-shuttle-crtsh",
    "nightloom-shuttle-dns",
    "nightloom-shuttle-github",
    "nightloom-shuttle-gleif",
    "nightloom-shuttle-gravatar",
    "nightloom-shuttle-hibp",
    "nightloom-shuttle-internetdb",
    "nightloom-shuttle-rdap",
    "nightloom-shuttle-ripestat",
    "nightloom-shuttle-registrable-domain",
    "nightloom-shuttle-screenshot",
    "nightloom-shuttle-usernames",
    "nightloom-shuttle-wayback",
    "nightloom-shuttle-web",
    "nightloom-shuttle-wikidata",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
nightloom-api = { workspace = true }
nightloom-core = { workspace = true }
nightloom-sdk = { workspace = true }
nightloom-shuttle-active = { workspace = true }
nightloom-shuttle-crtsh = { workspace = true }
nightloom-shuttle-dns = { workspace = true }
nightloom-shuttle-github = { workspace = true }
nightloom-shuttle-gleif = { workspace = true }
nightloom-shuttle-gravatar = { workspace = true }
nightloom-shuttle-hibp = { workspace = true }
nightloom-shuttle-internetdb = { workspace = true }
nightloom-shuttle-rdap = { workspace = true }
nightloom-shuttle-ripestat = { workspace = true }
nightloom-shuttle-registrable-domain = { workspace = true }
nightloom-shuttle-screenshot = { workspace = true }
nightloom-shuttle-usernames = { workspace = true }
nightloom-shuttle-wayback = { workspace = true }
nightloom-shuttle-web = { workspace = true }
nightloom-shuttle-wikidata = { workspace = true }
