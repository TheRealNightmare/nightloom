# Included in every static location (add_header in a location replaces the
# server-level ones, so they are listed here once and included).
#
# CSP: everything from this origin only. sigma.js renders with WebGL and may
# rasterize label images through blob: URLs; the layout library can run in a
# blob: web worker. No inline scripts or styles, no eval, no third parties.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
