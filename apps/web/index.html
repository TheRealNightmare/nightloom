<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- --bg of each theme (src/styles/tokens.css); the app updates it when the theme changes. -->
    <meta name="theme-color" content="#12131a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Nightloom — Every thread, woven into the full picture." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nightloom</title>
    <!-- Sets data-theme before the first paint (an external file: the CSP allows no inline scripts). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
