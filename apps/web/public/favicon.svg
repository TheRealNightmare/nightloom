<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The app icon: a knot on a brass thread (scripts/render-icons.mjs draws the PNG sizes from it). Colors are the design tokens of src/styles/tokens.css. -->
  <style>
    .bg { fill: #12131a; }
    .thread { stroke: #c8963e; }
    .knot { fill: #12131a; stroke: #e8e1d3; }
    .dot { fill: #c8963e; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f4f0e6; }
      .thread { stroke: #8a5a1c; }
      .knot { fill: #f4f0e6; stroke: #1d1c22; }
      .dot { fill: #8a5a1c; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <path class="thread" d="M3.5 21C9.5 21 11 16 16 16S22.5 11 28.5 11" stroke-width="2" stroke-linecap="round"/>
  <circle class="knot" cx="16" cy="16" r="4.75" stroke-width="2"/>
  <circle class="dot" cx="16" cy="16" r="1.6"/>
</svg>
