# Nightloom local development stack.
#
# Run from the repository root:
#   make up        # or: docker compose -f deploy/compose.yaml --env-file .env up -d --build --wait
#
# Every published port is bound to 127.0.0.1 only; change the host side with
# the *_HOST_PORT variables in .env if one clashes with a local service.
# Secrets come from .env (copy .env.example and change the passwords);
# nothing secret is committed.
# Relative paths below resolve against this directory (deploy/).

name: nightloom

# json-file logs, rotated: at most 5 x 10 MB per container, so the API's and
# the worker's logs reach back far enough to diagnose a job afterwards. They
# still go with the container when it is recreated (`make down` / `make up`).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18+ images declare VOLUME /var/lib/postgresql and keep
      # PGDATA in a versioned subdirectory (/var/lib/postgresql/18/docker),
      # so mount the parent directory, not .../data.
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary server used while init scripts
      # run listens on the Unix socket only, so it never reports healthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  neo4j:
    image: neo4j:2026.10.2-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      # Small dev footprint; tune for real workloads.
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "127.0.0.1:${NEO4J_HTTP_HOST_PORT:-7474}:7474" # HTTP / Neo4j Browser
      - "127.0.0.1:${NEO4J_BOLT_HOST_PORT:-7687}:7687" # Bolt
    healthcheck:
      # The HTTP discovery endpoint answers without auth once the server is up.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  valkey:
    image: valkey/valkey:9.0.7-alpine
    restart: unless-stopped
    # The password is interpolated by Compose so the image's entrypoint still
    # drops root privileges before starting the server.
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    environment:
      # Lets valkey-cli (healthcheck, `docker compose exec`) authenticate.
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    ports:
      - "127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    # `weed mini` runs master, volume, filer and the S3 gateway in one process.
    # WebDAV, the admin UI and the Iceberg/Lance catalogs are not needed.
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # The S3 gateway turns these into a static admin identity, so no
      # identities file with credentials is needed.
      AWS_ACCESS_KEY_ID: ${NIGHTLOOM_S3_ACCESS_KEY:?set NIGHTLOOM_S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${NIGHTLOOM_S3_SECRET_KEY:?set NIGHTLOOM_S3_SECRET_KEY in .env}
      # Created on startup if missing (an existing bucket is left untouched).
      S3_BUCKET: ${NIGHTLOOM_S3_BUCKET:?set NIGHTLOOM_S3_BUCKET in .env}
    volumes:
      # Volume files and the filer metadata (/data/filerldb2) both live here.
      - seaweedfs_data:/data
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333" # S3 API
    healthcheck:
      # Healthy only when the S3 gateway is up AND the bucket exists
      # (checked through the filer, which needs no S3 credentials).
      test:
        - CMD-SHELL
        - >-
          curl -fsS -o /dev/null http://127.0.0.1:8333/healthz &&
          curl -fsS -o /dev/null -H 'Accept: application/json'
          "http://127.0.0.1:8888/buckets/$${S3_BUCKET}/"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # One-shot: applies the PostgreSQL migrations and the Neo4j schema
  # (constraints and indexes, idempotent), then exits. `api` starts only after
  # it exits successfully. Rerun it with `make migrate`.
  migrate:
    image: nightloom-api:dev
    # Built by the `api` service below (same image).
    pull_policy: never
    command:
      - sh
      - -c
      - alembic upgrade head && python -m nightloom_api.graph.schema apply
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      NIGHTLOOM_ENV: ${NIGHTLOOM_ENV:-development}
      NIGHTLOOM_LOG_LEVEL: ${NIGHTLOOM_LOG_LEVEL:-INFO}
      NIGHTLOOM_DATABASE_URL: ${NIGHTLOOM_DATABASE_URL:?set NIGHTLOOM_DATABASE_URL in .env}
      NIGHTLOOM_NEO4J_URI: ${NIGHTLOOM_NEO4J_URI:?set NIGHTLOOM_NEO4J_URI in .env}
      NIGHTLOOM_NEO4J_USER: ${NIGHTLOOM_NEO4J_USER:?set NIGHTLOOM_NEO4J_USER in .env}
      NIGHTLOOM_NEO4J_PASSWORD: ${NIGHTLOOM_NEO4J_PASSWORD:?set NIGHTLOOM_NEO4J_PASSWORD in .env}
      # Not used by the migrations, but with NIGHTLOOM_ENV=production the
      # settings refuse to load while any secret is still the built-in
      # change-me default.
      NIGHTLOOM_VALKEY_URL: ${NIGHTLOOM_VALKEY_URL:?set NIGHTLOOM_VALKEY_URL in .env}
      NIGHTLOOM_S3_ACCESS_KEY: ${NIGHTLOOM_S3_ACCESS_KEY}
      NIGHTLOOM_S3_SECRET_KEY: ${NIGHTLOOM_S3_SECRET_KEY}
    # The image's HEALTHCHECK probes the HTTP server, which this container never runs.
    healthcheck:
      disable: true

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: nightloom-api:dev
    logging: *logging
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    # Only the variables the API reads; infrastructure secrets stay out.
    environment:
      NIGHTLOOM_ENV: ${NIGHTLOOM_ENV:-development}
      NIGHTLOOM_LOG_LEVEL: ${NIGHTLOOM_LOG_LEVEL:-INFO}
      NIGHTLOOM_DATABASE_URL: ${NIGHTLOOM_DATABASE_URL:?set NIGHTLOOM_DATABASE_URL in .env}
      NIGHTLOOM_NEO4J_URI: ${NIGHTLOOM_NEO4J_URI:?set NIGHTLOOM_NEO4J_URI in .env}
      NIGHTLOOM_NEO4J_USER: ${NIGHTLOOM_NEO4J_USER:?set NIGHTLOOM_NEO4J_USER in .env}
      NIGHTLOOM_NEO4J_PASSWORD: ${NIGHTLOOM_NEO4J_PASSWORD:?set NIGHTLOOM_NEO4J_PASSWORD in .env}
      NIGHTLOOM_VALKEY_URL: ${NIGHTLOOM_VALKEY_URL:?set NIGHTLOOM_VALKEY_URL in .env}
      NIGHTLOOM_S3_ENDPOINT: ${NIGHTLOOM_S3_ENDPOINT:?set NIGHTLOOM_S3_ENDPOINT in .env}
      NIGHTLOOM_S3_ACCESS_KEY: ${NIGHTLOOM_S3_ACCESS_KEY}
      NIGHTLOOM_S3_SECRET_KEY: ${NIGHTLOOM_S3_SECRET_KEY}
      NIGHTLOOM_S3_BUCKET: ${NIGHTLOOM_S3_BUCKET}
      NIGHTLOOM_S3_REGION: ${NIGHTLOOM_S3_REGION:-us-east-1}
      NIGHTLOOM_COOKIE_SECURE: ${NIGHTLOOM_COOKIE_SECURE:-false}
      # Trust X-Forwarded-For / X-Forwarded-Proto only from the `web` proxy's
      # fixed address (see `networks` below), so the API sees the real client
      # IP behind nginx while a client cannot spoof it. Never "*".
      FORWARDED_ALLOW_IPS: ${NIGHTLOOM_WEB_IP:-172.30.0.10}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Runs Shuttle jobs from the Valkey queue (Celery). Same image as `api`,
  # different command. 4 worker processes, each running one job at a time,
  # fit comfortably on a 16 GB machine next to the rest of the stack; change
  # NIGHTLOOM_WORKER_CONCURRENCY in .env. A process is replaced after 100
  # jobs or 512 MB, so a leaky Shuttle cannot grow it forever.
  worker:
    image: nightloom-api:dev
    # Built by the `api` service (same image).
    pull_policy: never
    logging: *logging
    restart: unless-stopped
    command:
      - celery
      - --app=nightloom_worker.celery_app
      - worker
      - --queues=shuttles
      - --hostname=worker@%h
      - --concurrency=${NIGHTLOOM_WORKER_CONCURRENCY:-4}
      - --max-tasks-per-child=100
      - --max-memory-per-child=524288
      - --loglevel=${NIGHTLOOM_LOG_LEVEL:-INFO}
      - --without-gossip
      - --without-mingle
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      valkey:
        condition: service_healthy
      # Evidence (screenshots) is stored there.
      seaweedfs:
        condition: service_healthy
    # The same NIGHTLOOM_* variables as the API (the settings are shared).
    environment:
      NIGHTLOOM_ENV: ${NIGHTLOOM_ENV:-development}
      NIGHTLOOM_LOG_LEVEL: ${NIGHTLOOM_LOG_LEVEL:-INFO}
      NIGHTLOOM_DATABASE_URL: ${NIGHTLOOM_DATABASE_URL:?set NIGHTLOOM_DATABASE_URL in .env}
      NIGHTLOOM_NEO4J_URI: ${NIGHTLOOM_NEO4J_URI:?set NIGHTLOOM_NEO4J_URI in .env}
      NIGHTLOOM_NEO4J_USER: ${NIGHTLOOM_NEO4J_USER:?set NIGHTLOOM_NEO4J_USER in .env}
      NIGHTLOOM_NEO4J_PASSWORD: ${NIGHTLOOM_NEO4J_PASSWORD:?set NIGHTLOOM_NEO4J_PASSWORD in .env}
      NIGHTLOOM_VALKEY_URL: ${NIGHTLOOM_VALKEY_URL:?set NIGHTLOOM_VALKEY_URL in .env}
      NIGHTLOOM_S3_ENDPOINT: ${NIGHTLOOM_S3_ENDPOINT:?set NIGHTLOOM_S3_ENDPOINT in .env}
      NIGHTLOOM_S3_ACCESS_KEY: ${NIGHTLOOM_S3_ACCESS_KEY}
      NIGHTLOOM_S3_SECRET_KEY: ${NIGHTLOOM_S3_SECRET_KEY}
      NIGHTLOOM_S3_BUCKET: ${NIGHTLOOM_S3_BUCKET}
      NIGHTLOOM_S3_REGION: ${NIGHTLOOM_S3_REGION:-us-east-1}
      # Public resolvers the DNS Shuttle asks (never the host's own resolver).
      # Private addresses are refused at startup; see docs/ARCHITECTURE.md.
      NIGHTLOOM_DNS_RESOLVERS: ${NIGHTLOOM_DNS_RESOLVERS:-1.1.1.1,9.9.9.9}
      # The browser service of the screenshot Shuttle (profile `screenshots`).
      NIGHTLOOM_BROWSER_URL: ${NIGHTLOOM_BROWSER_URL:-ws://browser:3000/}
    # The default network, and the internal one the browser service is on.
    networks:
      - default
      - browser
    # A running job may take up to 10 minutes; on shutdown, jobs that do not
    # finish in time are re-delivered and then recorded as failed (or, if the
    # worker does not come back, failed by another worker's reaper).
    stop_grace_period: 60s
    healthcheck:
      # Asks this worker (by its node name) to answer over the broker.
      test:
        - CMD-SHELL
        - celery --app=nightloom_worker.celery_app inspect ping --destination "worker@$$HOSTNAME" --timeout 5 > /dev/null
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  # The screenshot Shuttle's browser (Playwright's browser server with
  # Chromium), only with `make up SCREENSHOTS=1` (Compose profile
  # `screenshots`). It is on the internal `browser` network only: no internet,
  # no other service but the worker, which answers every request a page makes
  # through its guarded HTTP client. Read-only, no capabilities, bounded
  # memory and processes; about 1 GB of image, so it is optional.
  browser:
    profiles: ["screenshots"]
    build:
      context: browser
    image: nightloom-browser:dev
    logging: *logging
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /home/pwuser:size=256m,mode=1777
    shm_size: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 1024
    networks:
      - browser

  # Web UI: the built single-page app behind nginx, which also proxies /api/
  # to the `api` service, so the browser only ever talks to this origin.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: nightloom-web:dev
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NIGHTLOOM_API_UPSTREAM: http://api:8000
    networks:
      default:
        # Fixed, so the API can trust this one address as its reverse proxy.
        ipv4_address: ${NIGHTLOOM_WEB_IP:-172.30.0.10}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Tool container for the evidence bucket (rclone), used by `make backup`
  # and `make restore` to copy the bucket over the S3 API. Never started by
  # `up` (profile `tools`); run it with `docker compose ... run --rm s3-tools`.
  # The remote is called `store`, e.g. `s3-tools lsf store:nightloom-evidence`.
  s3-tools:
    image: rclone/rclone:1.75.2
    profiles: [tools]
    restart: "no"
    environment:
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: SeaweedFS
      RCLONE_CONFIG_STORE_ENDPOINT: ${NIGHTLOOM_S3_ENDPOINT:?set NIGHTLOOM_S3_ENDPOINT in .env}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${NIGHTLOOM_S3_ACCESS_KEY}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${NIGHTLOOM_S3_SECRET_KEY}
      RCLONE_CONFIG_STORE_REGION: ${NIGHTLOOM_S3_REGION:-us-east-1}
      RCLONE_CONFIG_STORE_FORCE_PATH_STYLE: "true"
      # The bucket always exists (SeaweedFS creates it); never try to.
      RCLONE_S3_NO_CHECK_BUCKET: "true"
      # Configuration comes only from the variables above.
      RCLONE_CONFIG: /dev/null
    depends_on:
      seaweedfs:
        condition: service_healthy

networks:
  # Only the worker and the browser service: no route out (internal), so the
  # browser can reach nothing the worker does not fetch for it.
  browser:
    internal: true
  default:
    # A fixed subnet, so `web` can have a static address. Change it with
    # NIGHTLOOM_NETWORK_SUBNET (and NIGHTLOOM_WEB_IP) only if it clashes with a
    # network on your machine.
    # Every other container gets its address from ip_range, which must lie
    # inside the subnet and must NOT contain NIGHTLOOM_WEB_IP: then no other
    # container can be handed the one address the API trusts as its proxy,
    # e.g. when `web` is recreated after the others.
    ipam:
      config:
        - subnet: ${NIGHTLOOM_NETWORK_SUBNET:-172.30.0.0/24}
          ip_range: ${NIGHTLOOM_NETWORK_IP_RANGE:-172.30.0.128/25}

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  valkey_data:
  seaweedfs_data:
