repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Two trailing spaces are a Markdown line break (see .editorconfig).
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        # pnpm writes the lockfile as two YAML documents. The Compose files
        # are checked below.
        exclude: ^(pnpm-lock\.yaml|deploy/compose(\.[a-z-]+)?\.yaml)$
      - id: check-yaml
        name: check yaml (Compose files, syntax only)
        # Compose overrides use the !reset and !override tags, which a plain
        # YAML loader cannot construct. `docker compose config` (CI) checks
        # their meaning.
        args: [--unsafe]
        files: ^deploy/compose(\.[a-z-]+)?\.yaml$
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        # mypy reads its file list from pyproject.toml; check the whole project.
        pass_filenames: false

  # Web frontend (apps/web). These run only when files under apps/web/ are
  # staged, so Python-only commits stay fast. They need `make web-install`.
  # ESLint is type-aware, so it checks the whole project, not just the
  # staged files.
  - repo: local
    hooks:
      - id: web-prettier
        name: prettier (web)
        entry: pnpm --dir apps/web exec prettier --check .
        language: system
        files: ^apps/web/
        pass_filenames: false
      - id: web-eslint
        name: eslint (web)
        entry: pnpm --dir apps/web exec eslint . --max-warnings=0
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|cjs)$
        pass_filenames: false
